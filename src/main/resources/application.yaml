server:
  port: 8099

spring:
  application:
    name: secure-login

  datasource:
    url: jdbc:mysql://localhost:3306/secure_login_db
    username: root
    password: 1434
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
